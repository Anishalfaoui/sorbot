# Spring Boot
server.port=8081
spring.application.name=sorbot-backend

# PostgreSQL (Supabase Session Pooler)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.sduljyubyypvugiwrxxu}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# AI Engine connection
ai.engine.base-url=${AI_ENGINE_URL:http://localhost:8000}
ai.engine.timeout-seconds=120

# Trading settings
trading.mode=MANUAL
trading.poll-interval-ms=60000
trading.auto-trade-enabled=false

# CORS
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# JWT Configuration
jwt.secret=c29yYm90LXRyYWRpbmctand0LXNlY3JldC1rZXktdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTY=
jwt.expiration-ms=86400000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.sorbot=DEBUG
logging.level.org.springframework.web=INFO
